# Hardware-independent candidate config only: NOT deployment ready.
# Before running: select a real LeRobot dataset, align its normalization stats
# and register/verify the matching OpenPI TrainConfig. See
# docs/experiments/openpi_recap_franka/data_contract.md.
defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "realworld_franka_pi05_sft"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 100

data:
  # Replace with a real LeRobot dataset after its schema is audited.
  train_data_paths: "/path/to/franka_lerobot_dataset"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 32
  seed: 0
  model:
    model_path: "/path/to/pi05_base_pytorch"
    action_dim: 7
    num_action_chunks: 5
    openpi:
      task: sft
      # Existing pi0.5 real-world transform; registration has an upstream
      # repo_id and must be adapted to the actual dataset before launch.
      config_name: "pi05_franka_pnp"
      action_horizon: 5
      discrete_state_input: false
      num_images_in_input: 2
      detach_critic_input: true
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 2000
    lr_warmup_steps: 100
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
