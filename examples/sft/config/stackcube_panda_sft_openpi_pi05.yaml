# Panda StackCube-v1 LeRobot demonstrations -> OpenPI pi0.5 SFT (preflight config).
# Run ONLY after downloading a compatible pi0.5 PyTorch checkpoint and
# validating the transforms with scripts/check_stackcube_openpi_inputs.py.
defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "stackcube_panda_pi05_sft"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 10
  val_check_interval: -1
  save_interval: 10

data:
  # The run_vla_sft.sh launcher exports REPO_PATH.
  train_data_paths: "${oc.env:REPO_PATH}/outputs/stackcube_recap/lerobot_stackcube_v2"
  num_workers: 0

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 4
  seed: 42
  model:
    # Override on the CLI with an actual OpenPI pi0.5 PyTorch checkpoint.
    model_path: "/path/to/pi05_base_pytorch"
    model_type: "openpi"
    num_action_chunks: 10
    action_dim: 7
    num_steps: 5
    add_value_head: False
    openpi:
      task: sft
      config_name: "pi05_stackcube_panda"
      num_images_in_input: 2
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      model_action_dim: 32
      action_horizon: 10
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: False
      train_expert_only: False
      detach_critic_input: True
    openpi_data:
      norm_stats_path: "${oc.env:REPO_PATH}/outputs/stackcube_recap/openpi_norm/stackcube_panda/norm_stats.json"

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_warmup_steps: 2
    total_training_steps: 10
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
