env_type: maniskill
total_num_envs: 1
wrap_obs_mode: proprio
task_description: "Stack the red cube on the green cube"
auto_reset: False
ignore_terminations: False
use_rel_reward: False
reward_mode: raw
seed: 1000
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 50
max_episode_steps: 50
enable_offload: False

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: outputs/stackcube_recap/evaluation_videos

init_params:
  id: StackCube-v1
  robot_uids: panda_wristcam
  num_envs: 1
  obs_mode: rgb
  control_mode: pd_ee_delta_pose
  sim_backend: physx_cpu
  sim_config:
    sim_freq: 100
    control_freq: 20
  max_episode_steps: 50
  sensor_configs:
    shader_pack: default
  render_mode: rgb_array
