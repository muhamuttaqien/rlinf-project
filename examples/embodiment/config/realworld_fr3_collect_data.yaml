# Offline configuration validation only. The physical collection entry point is incompatible.
defaults:
  - env/fr3_offline@env.eval
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    env: 0

runner:
  task_type: embodied
  logger:
    log_path: ./logs/fr3_offline_synthetic
    project_name: rlinf
    experiment_name: fr3-offline-synthetic
    logger_backends: [tensorboard]
  num_data_episodes: 20
  record_task_description: false

env:
  group_name: EnvGroup
