# Offline synthetic validation/recording only. The physical collector is incompatible.
defaults:
  - env/fr3_offline@env.eval
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    env: 0

runner:
  task_type: embodied
  logger:
    log_path: ./logs/fr3_offline_synthetic
    project_name: rlinf
    experiment_name: fr3-offline-synthetic
    logger_backends: [tensorboard]
  num_data_episodes: 20
  record_task_description: false

env:
  group_name: EnvGroup

# Dedicated synthetic recorder only; native physical collection stays disabled.
offline_collection:
  schema_version: 1
  step_period_ns: 100000000
  max_sample_age_ns: 50000000
  max_sample_skew_ns: 20000000
