# Usage:
#   bash examples/offline_rl/advantage_labeling/recap/process/run_compute_returns.sh recap_compute_returns

data:
  data_root: ${oc.env:RLINF_DATA_ROOT,/data1/Muttaqien}/datasets
  train_data_paths:
    - dataset_path: recap_sft
      type: sft
    - dataset_path: recap_rollout
      type: rollout

  dataset_type: "sft"
  gamma: 1.0
  failure_reward: -300.0
  tag: null
  num_workers: 128

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
