# @package _global_
# Mixed-outcome Goal Task 0 value critic (1,000-step pilot).
# Separate from original success-only SIM-4 checkpoint: DO NOT overwrite it.
# Train return normalization is computed from mixed TRAIN stats.json only.
defaults:
  - /model/recap_value_model@actor.model
  - /hybrid_engines/fsdp@actor.fsdp_config
  - _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: "2"
runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf-goal-recap
    experiment_name: value_goal_task0_mixed_pilot
    logger_backends:
      - tensorboard
  max_epochs: 30000
  max_steps: 1000
  val_check_interval: 250
  save_interval: 500
data:
  tag: libero_goal_task0_recap
  # Includes 163 successes and 37 failures; no held-out data in normalization.
  train_data_paths:
    - dataset_path: /data1/Muttaqien/rlinf_data/recap_libero_goal_task0/libero_goal_task0_train
      type: rollout
      weight: 1.0
      robot_type: libero
      model_type: pi05
  eval_data_paths:
    - dataset_path: /data1/Muttaqien/rlinf_data/recap_libero_goal_task0/libero_goal_task0_eval
      max_samples: 10000
      robot_type: libero
      model_type: pi05
  train_num_workers: 8
  eval_num_workers: 4
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false
  include_state: true
  gamma: 1.0
  action_horizon: 10
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 7
  robot_type: libero
  model_type: pi05
  balance_weights: true
  seed: 42
algorithm:
  adv_type: gae
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 256
  seed: 0
  model:
    precision: bf16
    siglip_path: /data1/Muttaqien/rlinf_data/models/siglip2-so400m-patch14-224
    gemma3_path: /data1/Muttaqien/rlinf_data/models/gemma-3-270m
    tokenizer_path: /data1/Muttaqien/rlinf_data/models/gemma-3-270m
    freeze_vlm: false
    action_dim: 7
    action_horizon: 10
  optim:
    lr: 5.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: 500
    total_training_steps: 8000
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
