# @package _global_
# Goal-specific SIM-5: set advantage.value_checkpoint=... to trained Goal critic.
defaults:
  - /model/recap_value_model@advantage.model
  - _self_
advantage:
  value_checkpoint: /REPLACE_WITH_GOAL_TASK0_CRITIC/full_weights.pt
  batch_size: 64
  flush_interval: 256
  num_dataloader_workers_per_gpu: 8
  prefetch_factor: 2
  batch_video_decode: true
  discount_next_value: true
  positive_quantile: 0.3
  tag: libero_goal_task0_recap
  returns_tag: libero_goal_task0_recap
  model:
    critic_expert_variant: gemma_1m
    tokenizer_path: /data1/Muttaqien/rlinf_data/models/gemma-3-270m
    siglip_path: /data1/Muttaqien/rlinf_data/models/siglip2-so400m-patch14-224
    gemma3_path: /data1/Muttaqien/rlinf_data/models/gemma-3-270m
data:
  model_type: pi05
  train_data_paths:
    - dataset_path: /data1/Muttaqien/rlinf_data/recap_libero_goal_task0/libero_goal_task0_train
      robot_type: libero
      type: rl
      weight: 1.0
  advantage_lookahead_step: 10
  gamma: 1.0
distributed:
  enabled: true
  backend: nccl
  timeout: 3600
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
  job:
    chdir: false
