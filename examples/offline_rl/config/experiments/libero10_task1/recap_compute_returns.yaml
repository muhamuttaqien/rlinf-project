# @package _global_
# Task-specific LIBERO-10 Task 1 RECAP: compute return/reward sidecars.
# Launcher: bash examples/offline_rl/advantage_labeling/recap/process/run_compute_returns.sh experiments/libero10_task1/recap_compute_returns
data:
  data_root: null
  train_data_paths:
    - dataset_path: /data1/Muttaqien/rlinf_data/recap_libero10_task1/libero10_task1_sft
      type: sft
    - dataset_path: /data1/Muttaqien/rlinf_data/recap_libero10_task1/libero10_task1_train
      type: rollout
    - dataset_path: /data1/Muttaqien/rlinf_data/recap_libero10_task1/libero10_task1_eval
      type: rollout
  dataset_type: sft
  gamma: 1.0
  failure_reward: -300.0
  tag: libero10_task1_recap
  num_workers: 8
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
