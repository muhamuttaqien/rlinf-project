# @package _global_
defaults:
- /model/recap_value_model@advantage.model
advantage:
  value_checkpoint: /path/to/value_checkpoint
  batch_size: 1024
  flush_interval: 256
  num_dataloader_workers_per_gpu: 12
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  tag: libero10_task0_recap
  returns_tag: libero10_task0_recap
  model:
    critic_expert_variant: gemma_1m
    tokenizer_path: /path/to/gemma-3-270m
    siglip_path: /path/to/siglip2-so400m-patch14-224
    gemma3_path: /path/to/gemma-3-270m
data:
  model_type: pi05
  train_data_paths:
  - dataset_path: /data1/Muttaqien/rlinf_data/recap_libero10_task0/libero10_task0_sft
    robot_type: libero
    type: sft
    weight: 1.0
  advantage_lookahead_step: 10
  gamma: 1.0
distributed:
  enabled: true
  backend: nccl
  timeout: 3600
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
  job:
    chdir: false
